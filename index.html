<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>To-do</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#EDEFEC; --card:#FFFFFF; --ink:#1D2926; --muted:#6B7773; --line:#D5DAD6;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --danger:#B3402F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A18; --card:#1E2724; --ink:#E7ECE9; --muted:#8E9B96; --line:#2C3834;
    --accent:#4FBF9F; --accent-ink:#0E1513; --danger:#E27A68;
  }
}
:root[data-theme="dark"]{
  --bg:#141A18; --card:#1E2724; --ink:#E7ECE9; --muted:#8E9B96; --line:#2C3834;
  --accent:#4FBF9F; --accent-ink:#0E1513; --danger:#E27A68;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:0 14px 96px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px;line-height:1.15}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.add{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.add input,.add textarea{flex:1;min-width:0;height:58px;font:inherit;font-size:17px;line-height:24px;padding:16px 16px 0;resize:none;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.add input:focus,.add textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.add button{height:58px;min-width:72px;font:inherit;font-weight:600;font-size:16px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.opts{display:flex;gap:8px;margin:0 0 10px}
.opts label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.opts select,.opts input{font:inherit;font-size:16px;height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%}
.opts select:focus,.opts input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:0;padding-bottom:0}
.meta .hi{color:var(--danger);font-weight:600}
.meta .late{color:var(--danger);font-weight:600}
li.done .meta{opacity:.6}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tabs button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
li{position:relative;overflow:hidden;border-bottom:1px solid var(--line);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sw{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);position:relative;z-index:1;transition:transform .2s ease;touch-action:pan-y}
li.lp .sw{box-shadow:inset 0 0 0 999px rgba(127,127,127,.14)}
.swdel{position:absolute;top:0;right:0;bottom:0;width:76px;border:0;border-radius:0;background:#C0392B;color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.swdel svg{width:24px;height:24px}
li:last-child{border-bottom:0}
.num{flex:none;min-width:20px;line-height:28px;text-align:right;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.check{flex:none;width:24px;height:24px;margin-top:0;border-radius:7px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);padding:0}
li.done .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:14px;height:14px;opacity:0}
li.done .check svg{opacity:1}
.text{flex:1;min-width:0;font-size:16px;line-height:22px;word-break:break-word;overflow-wrap:anywhere;padding:3px 0}
li.done .t{color:var(--muted);text-decoration:line-through}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.frow[hidden]{display:none}
.frow .linkbtn{margin-top:0;flex:1;min-width:0;text-align:left}
#trashBtn{flex:none;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--danger);background:rgba(179,64,47,.1);color:var(--danger);display:grid;place-items:center;padding:0;cursor:pointer}
#trashBtn svg{width:22px;height:22px}
#rowScrim{position:fixed;inset:0;z-index:29;background:transparent}
#rowScrim[hidden]{display:none}
#rowMenu{position:fixed;z-index:30;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);overflow:hidden}
#rowMenu[hidden]{display:none}
#rowMenu button{display:block;width:100%;font:inherit;font-size:16px;padding:14px 18px;border:0;border-radius:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
#rowMenu button+button{border-top:1px solid var(--line)}
#rowMenu .rmdel{color:var(--danger)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.upd{display:flex;align-items:center;gap:12px;margin-top:26px;color:var(--muted);font-size:14px}
.upd button{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheetbox{width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.sheetbox .opts{margin-bottom:0}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.text{cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.28);max-width:calc(100% - 32px);white-space:nowrap}
#toast[hidden]{display:none}
#toast button{font:inherit;font-weight:700;font-size:14px;color:inherit;text-decoration:underline;background:none;border:0;padding:10px 12px;cursor:pointer;border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between}
#upd{flex:none;width:44px;height:44px;margin:0 -10px 0 0;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:12px;cursor:pointer;padding:0}
#upd svg{width:22px;height:22px}
#updMsg{display:block;font-size:13px;color:var(--muted);margin:-8px 0 10px}
#updMsg:empty{display:none}
.empty{white-space:pre-line;padding:56px 24px;line-height:1.5;font-size:15px}
.empty::first-line{font-size:18px;font-weight:600;color:var(--ink)}
ul.isEmpty{background:transparent;border:0;overflow:visible}
.empty{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:50vh;padding:24px;border:0!important;white-space:normal}
.eic{width:72px;height:72px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent);margin-bottom:16px}
.eic svg{width:32px;height:32px}
.eh{font-size:19px;font-weight:600;color:var(--ink)}
.ep{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4}
.ego{margin-top:18px;font:inherit;font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.affhead{font-size:13px;color:var(--muted);margin:2px 0 10px}
.affcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.afftxt{font-size:16px;line-height:1.45;font-weight:600}
.affby{font-size:12px;color:var(--muted);margin:14px 0 0;text-align:center}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;position:relative;overflow:hidden;transition:transform .12s}
button:active{transform:scale(.96)}
#fab:active{transform:translateX(-50%) scale(.96)}
.ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;opacity:.2;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){.check.pop{animation:none}button:active{transform:none}#fab:active{transform:translateX(-50%)}}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:20px 0 8px}
#hdr .tabs{margin-bottom:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.subrow{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.subrow .sub{margin:0}
#clear{flex:none;font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--ink);cursor:pointer;padding:12px 0 12px 14px;margin:-12px 0;border-radius:10px}
#clear[hidden]{display:none}
.tools{display:flex;align-items:center}
#focusBtn{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:12px;cursor:pointer;padding:0}
#focusBtn svg{width:22px;height:22px}
.linkbtn{margin-top:12px;font:inherit;font-weight:600;font-size:15px;padding:10px 0;border:0;background:none;color:var(--accent);cursor:pointer}
.linkbtn[hidden]{display:none}
.fh{font-size:20px;font-weight:800;margin-bottom:12px}
.flab{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fsel{font:inherit;font-size:16px;height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.fdur{display:flex;gap:8px;margin-top:14px}
.fdur button{flex:1;height:60px;font:inherit;font-weight:700;font-size:18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.fnote{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.4}
#focus{position:fixed;inset:0;z-index:100;background:#000;color:#6a6a6a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 24px 175px;touch-action:manipulation}
#focus[hidden]{display:none}
#fclock{width:min(68vw,300px);height:auto}
#ftitle{font-size:15px;color:#8a8a8a;text-align:center;max-width:90%;min-height:20px}
#fleft{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;color:#d8d8d8;min-height:40px;text-align:center}
#fmsg{font-size:15px;color:#a8a8a8;min-height:20px;text-align:center}
.ftog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.ftog input{width:22px;height:22px;accent-color:var(--accent);flex:none}
#fctrl{position:absolute;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#fctrl[hidden]{visibility:hidden;display:flex}
#fctrl button{font:inherit;font-size:14px;padding:11px 16px;border-radius:999px;border:1.5px solid #333;background:transparent;color:#a0a0a0;cursor:pointer}#fctrl button.on{border-color:#8a8a8a;color:#e6e6e6}
#fquote{font-size:15px;line-height:1.45;color:#8a8a8a;text-align:center;max-width:88%;min-height:44px;transition:opacity .3s}
#fqby{font-size:12px;color:#5c5c5c;text-align:center;margin-top:-10px}
#fbanner{margin:0 0 8px;width:100%;font:inherit;font-weight:600;font-size:13px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;text-align:center}
#fbanner[hidden]{display:none}
#fkeep{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
@media (max-width:360px){.add button{min-width:64px;padding:0 14px}.opts{gap:6px}.opts select,.opts input{padding:0 8px}}
@media (prefers-reduced-motion:no-preference){.check{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <header id="hdr">
  <div class="top"><h1>To-do</h1><div class="tools"><button id="focusBtn" type="button" aria-label="Deep work timer" title="Deep work timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9.5 2.5h5"/></svg></button><button id="upd" type="button" aria-label="Update app" title="Update app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div></div>
  <div class="subrow"><p class="sub" id="sub"></p><button id="clear" type="button" hidden>Clear done</button></div>
  <span id="updMsg" role="status"></span>
  <button id="fbanner" type="button" hidden></button>
  <div class="tabs" role="group" aria-label="Filter tasks">
    <button type="button" data-f="today" aria-pressed="true">Today</button>
    <button type="button" data-f="upcoming" aria-pressed="false">Upcoming</button>
    <button type="button" data-f="affirmations" aria-pressed="false">Affirmations</button>
  </div>
  </header>
  <div class="sheet" id="sheet" hidden><div class="sheetbox"><div class="add">
    <textarea id="in" rows="1" placeholder="Add a task" autocomplete="off" name="task-text" data-lpignore="true" data-form-type="other" enterkeyhint="done" aria-label="New task"></textarea>
    <button id="addBtn" type="button">Add</button>
  </div>
  <div class="opts">
    <label>Priority
      <select id="pri" aria-label="Priority"><option value="2">High</option><option value="1" selected>Normal</option><option value="0">Low</option></select>
    </label>
    <label>Due date
      <input id="due" type="date" aria-label="Due date">
    </label>
  </div>
  <div class="frow" id="frow" hidden><button type="button" id="focusFromTask" class="linkbtn">Start a focus session on this task</button><button type="button" id="trashBtn" aria-label="Delete task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></div>
  </div></div>
  <div id="affwrap" hidden></div>
  <ul id="list"></ul>
  </main>
<div class="sheet" id="fsheet" hidden><div class="sheetbox">
  <div class="fh">Deep work</div>
  <label class="flab">Task (optional)
    <select id="ftask" class="fsel" aria-label="Task for this session"></select>
  </label>
  <div class="fdur"><button type="button" data-m="25">25 min</button><button type="button" data-m="50">50 min</button><button type="button" data-m="90">90 min</button></div>
  <label class="ftog"><input type="checkbox" id="ftick"><span>Tick-tock sound, like an old clock</span></label>
  <div class="fnote">The screen turns black. You get a nudge when 5 minutes are left. Tap the screen for Pause, Tick sound and Keep screen on.</div>
</div></div>
<div id="focus" hidden>
  <div id="ftitle"></div>
  <svg id="fclock" viewBox="0 0 200 200" aria-hidden="true"></svg>
  <div id="fleft" role="status"></div>
  <div id="fmsg" role="status"></div>
  <div id="fquote"></div>
  <div id="fqby">Idea from Deep Work by Cal Newport (paraphrased)</div>

  var AFF=["God is my unfailing supply, and large sums of money come to me quickly, under grace, in perfect ways.", "I have a perfect work in a perfect way; I give a perfect service for perfect pay.", "I am divinely sensitive to my intuitive leads, and give instant obedience to Thy will.", "My eyes are God's eyes, I see with the eyes of spirit. I see clearly the open way; there are no obstacles on my pathway. I see clearly the perfect plan.", "I cast this burden on the Christ within, and I go free!", "Every plan my Father in heaven has not planned, shall be dissolved and dissipated, and the Divine Idea now comes to pass.", "Only that which is true of God is true of me, for I and the Father are ONE.", "As I am one with God, I am one with my good, for God is both the Giver and the Gift. I cannot separate the Giver from the gift.", "Divine Love now dissolves and dissipates every wrong condition in my mind, body and affairs.", "Divine Love floods my consciousness with health, and every cell in my body is filled with light.", "My ears are God's ears, I hear with the ears of spirit. I am nonresistant and am willing to be led. I hear glad tidings of great joy.", "Infinite Spirit, open the way for the Divine Design of my life to manifest; let the genius within me now be released; let me see clearly the perfect plan.", "Infinite Spirit, open the way for my right home, my right friend, my right position. I give thanks it now manifests under grace in a perfect way.", "I am one with Infinite Intelligence. I know everything I should know on this subject.", "In Divine Mind there is only completion, therefore, my demonstration is completed. My perfect work, my perfect home, my perfect health.", "Infinite Spirit, give me a definite lead, reveal to me my perfect self-expression, show me which talent I am to make use of now.", "I am fully equipped for the Divine Plan of my life.", "I desire only that which God desires for me.", "Father, I'll take nothing less than I've asked for, but   var Q=["Quality of work comes from time spent multiplied by how intensely you focus.", "A short stretch of full focus can beat long hours of distracted effort.", "Deep, distraction-free effort is rare, and that is exactly why it is valuable.", "Decide your rules for depth ahead of time: where, for how long, and what you will leave out.", "Treat boredom as practice. Learn not to reach for your phone the moment something gets dull.", "Concentration is a skill like a muscle. It grows with regular, deliberate training.", "Plan the day in blocks, and rework the plan when interruptions hit.", "Say no to many shallow tasks so the important ones get your best hours.", "Pick a few big goals and track the daily hours you put into them.", "A visible scoreboard of deep hours keeps you honest and motivated.", "Build a ritual: the same place, the same start signal and the same supplies before each session.", "A clear end-of-day shutdown lets your mind rest, so tomorrow's focus is better.", "Truly unplugged time away from work helps good ideas form.", "Attention given to scattered tasks leaves a residue that follows you into the next one.", "Finish one thing before switching. Switching leaves part of your mind behind.", "Be deliberate about shallow work: batch it, limit it, and keep it from spilling over.", "A small, clear aim for each session beats a vague plan to work hard.", "People who produce rare and valuable work do it by going deep again and again.", "Give your best hours to your hardest task.", "You do not need perfect conditions. Start the session and let the focus build."];
  function fmtLeft(ms){ var rs=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(rs/3600), m=Math.floor((rs%3600)/60), sc=rs%60; return (h>0?h+":"+pad2(m):pad2(m))+":"+pad2(sc); }
  function updBanner(){ var b=document.getElementById("fbanner"); if(!fcs||fcs.done||!document.getElementById("focus").hidden){ b.hidden=true; return; } b.hidden=false; b.textContent=(fcs.paused?"Deep work paused \u00b7 ":"Deep work \u00b7 ")+fmtLeft(fcs.end-(fcs.paused||Date.now()))+" left \u00b7 tap to return"; }
  function showFocusScreen(push){
    document.getElementById("focus").hidden=false; document.getElementById("fbanner").hidden=true; lockOn(); setMeta("#000000");
    
    fTick();
  }
  function minimizeFocus(){ document.getElementById("focus").hidden=true; lockOff(); setMeta("#1F6F5C"); try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){} updBanner(); }
  document.getElementById("fbanner").onclick=function(){ if(fcs&&!fcs.done) showFocusScreen(); };
  // ----- Back button: always stay in the app and land on Today; exit only from Today -----
  function handleBack(){
    var fo=document.getElementById("focus"), fsh=document.getElementById("fsheet"); if(!document.getElementById("rowMenu").hidden){ hideRowMenu(); return true; } var opn=document.querySelector("li.open"); if(opn){ closeRow(opn); return true; }
    if(!fo.hidden){ if(fcs&&fcs.done) endFocus(); else minimizeFocus(); closeSheet(); setFilter("today"); render(); return true; }
    if(!fsh.hidden){ closeFocusSheet(); setFilter("today"); render(); return true; }
    if(!sheet.hidden){ closeSheet(); return true; }
    if(filter!=="today"){ setFilter("today"); render(); return true; }
    return false;
  }
  try{ history.replaceState({base:1},""); history.pushState({guard:1},""); }catch(e){}
  window.addEventListener("popstate",function(){ if(handleBack()){ try{ history.pushState({guard:1},""); }catch(e){} } else { try{ history.back(); }catch(e){} } });
  
  function setMeta(c){ try{ document.querySelector('meta[name="theme-color"]').setAttribute("content",c); }catch(e){} }
  function keepVideo(on){ try{ var v=document.getElementById("fkeep"); if(!v) return; if(on){ var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); } else v.pause(); }catch(e){} }
  var awakeOn=true;
  try{ awakeOn=localStorage.getItem("todo-focus-awake")!=="0"; }catch(e){}
  function lockOn(){ if(!awakeOn) return; keepVideo(true); try{ if(navigator.wakeLock&&!flock) navigator.wakeLock.request("screen").then(function(l){ flock=l; l.addEventListener("release",function(){ if(flock===l) flock=null; }); }).catch(function(){}); }catch(e){} }
  function lockOff(){ keepVideo(false); try{ if(flock){ flock.release(); flock=null; } }catch(e){} }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&fcs){ if(!fcs.done&&!document.getElementById("focus").hidden) lockOn(); fTick(); updBanner(); } });
  var fac=null;
  function getAC(){ try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; if(!fac) fac=new AC(); if(fac.state==="suspended") fac.resume(); return fac; }catch(e){ return null; } }
  function beep(freq,dur,vol,dt){ try{ var c=getAC(); if(!c) return; var o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+(dt||0); o.type="sine"; o.frequency.value=freq; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.05); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.start(t0); o.stop(t0+dur+.05); }catch(e){} }
  function chime(){ beep(660,1.4,.25,0); }
  var tickAlt=false, noiseBuf=null;
  function clickSound(){ try{ var c=getAC(); if(!c) return; tickAlt=!tickAlt;
    if(!noiseBuf||noiseBuf.sampleRate!==c.sampleRate){ var n=Math.floor(c.sampleRate*.06); noiseBuf=c.createBuffer(1,n,c.sampleRate); var d=noiseBuf.getChannelData(0); for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.exp(-i/(c.sampleRate*.006)); } }
    var t0=c.currentTime, src=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
    src.buffer=noiseBuf; bp.type="bandpass"; bp.frequency.value=tickAlt?3000:2200; bp.Q.value=1.2; g.gain.value=tickAlt?1.6:1.3;
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(t0);
    var o=c.createOscillator(), og=c.createGain(); o.type="sine"; o.frequency.value=tickAlt?950:760; og.gain.setValueAtTime(.35,t0); og.gain.exponentialRampToValueAtTime(.0001,t0+.045); o.connect(og); og.connect(c.destination); o.start(t0); o.stop(t0+.05);
  }catch(e){} }
  function buildClock(){
    var s='<circle cx="100" cy="100" r="92" fill="none" stroke="#1d1d1d" stroke-width="3"/><circle id="fprog" cx="100" cy="100" r="92" fill="none" stroke="#d8d8d8" stroke-width="3" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="'+FC+' '+FC+'" stroke-dashoffset="0"/>';
    for(var i=0;i<60;i++){ var a=i*6*Math.PI/180, big=i%5===0, r1=big?76:82, r2=86; s+='<line x1="'+(100+r1*Math.sin(a)).toFixed(2)+'" y1="'+(100-r1*Math.cos(a)).toFixed(2)+'" x2="'+(100+r2*Math.sin(a)).toFixed(2)+'" y2="'+(100-r2*Math.cos(a)).toFixed(2)+'" stroke="'+(big?"#bdbdbd":"#4a4a4a")+'" stroke-width="'+(big?3:1.5)+'" stroke-linecap="round"/>'; }
    s+='<line id="fh" x1="100" y1="100" x2="100" y2="58" stroke="#f0f0f0" stroke-width="5" stroke-linecap="round"/><line id="fm" x1="100" y1="100" x2="100" y2="34" stroke="#f0f0f0" stroke-width="3.5" stroke-linecap="round"/><line id="fs" x1="100" y1="110" x2="100" y2="26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/><circle cx="100" cy="100" r="4.5" fill="#f0f0f0"/>';
    return s;
  }
  function fSave(){ try{ localStorage.setItem(FKEY,JSON.stringify({end:fcs.end,total:fcs.total,text:fcs.text,qi:fcs.qi,paused:fcs.paused||0})); }catch(e){} }
  function pad2(n){ return (n<10?"0":"")+n; }
  function warn5(){
    vib([200,100,200]); beep(880,.5,.2,0); beep(880,.5,.2,.7);
    var m=document.getElementById("fmsg"); m.textContent="5 minutes left"; setTimeout(function(){ if(m.textContent==="5 minutes left") m.textContent=""; },20000);
  }
  function fTick(){
    if(!fcs||fcs.done) return;
    var ms=fcs.end-(fcs.paused||Date.now()), rs=Math.max(0,Math.ceil(ms/1000)), es=Math.max(0,Math.round(fcs.total/1000)-rs), h=Math.floor(es/3600), m=Math.floor((es%3600)/60), sc=es%60, rh=Math.floor(rs/3600), rm=Math.floor((rs%3600)/60), rsec=rs%60;
    document.getElementById("fh").setAttribute("transform","rotate("+((h+m/60)*30)+" 100 100)");
    document.getElementById("fm").setAttribute("transform","rotate("+((m+sc/60)*6)+" 100 100)");
    document.getElementById("fs").setAttribute("transform","rotate("+(sc*6)+" 100 100)");
    var qn=(fcs.qi+Math.floor(es/1800))%Q.length; if(fcs.qshown!==qn){ var first=(fcs.qshown===undefined); fcs.qshown=qn; var qe=document.getElementById("fquote"); if(first){ qe.textContent=Q[qn]; } else { qe.style.opacity=0; setTimeout(function(){ qe.textContent=Q[qn]; qe.style.opacity=1; },300); } }
    var fr=Math.max(0,Math.min(1,ms/fcs.total)); document.getElementById("fprog").setAttribute("stroke-dashoffset",String(FC*fr));
    if(ms<=0){ fComplete(); return; }
    document.getElementById("fleft").textContent = rh>0 ? rh+":"+pad2(rm)+":"+pad2(rsec) : pad2(rm)+":"+pad2(rsec);
    if(ms<=300000&&!fcs.paused){ if(!fcs.warned){ fcs.warned=true; if(fcs.total>300000&&ms>240000) warn5(); } }
  }
  function fSecond(){ fTick(); updBanner(); if(fcs&&!fcs.done&&!document.getElementById("focus").hidden&&!flock&&!document.hidden&&Math.floor(Date.now()/1000)%10===0) lockOn(); if(fcs&&!fcs.done&&!fcs.paused&&fcs.tick&&!document.getElementById("focus").hidden) clickSound(); }
  function findFocusTask(){ if(!fcs||!fcs.text) return null; return tasks.filter(function(x){ return !x.done&&x.text===fcs.text; })[0]||null; }
  function setMsg(t){ document.getElementById("fmsg").textContent=t; }
  function togglePause(){
    if(!fcs||fcs.done) return;
    if(fcs.paused){ fcs.end+=Date.now()-fcs.paused; fcs.paused=0; if(document.getElementById("fmsg").textContent==="Paused") setMsg(""); }
    else { fcs.paused=Date.now(); setMsg("Paused"); }
    fSave(); fTick(); updBanner(); showCtrl(false);
  }
  function toggleAwake(){
    awakeOn=!awakeOn; try{ localStorage.setItem("todo-focus-awake",awakeOn?"1":"0"); }catch(e){}
    if(awakeOn) lockOn(); else lockOff();
    showCtrl(false);
  }
  function showCtrl(done){
    var c=document.getElementById("fctrl"); c.innerHTML="";
    function mk(txt,fn){ var b=document.createElement("button"); b.type="button"; b.textContent=txt; b.onclick=function(e){ e.stopPropagation(); fn(); }; c.appendChild(b); }
    if(done){ var tk=findFocusTask(); if(tk) mk("Mark task done",function(){ tk.done=true; tk.doneAt=todayStr(); save(); endFocus(); render(); }); mk("Close",endFocus); }
    else { mk(fcs.paused?"Resume":"Pause",togglePause); mk("+5 min",function(){ fcs.end+=5*60000; fcs.total+=5*60000; fcs.warned=false; document.getElementById("fmsg").textContent=""; fSave(); fTick(); showCtrl(false); }); mk("Tick sound: "+(fcs.tick?"on":"off"),function(){ fcs.tick=!fcs.tick; try{ localStorage.setItem("todo-focus-tick",fcs.tick?"1":"0"); document.getElementById("ftick").checked=fcs.tick; }catch(e){} showCtrl(false); }); mk("Screen on: "+(awakeOn?"yes":"no"),toggleAwake); c.lastChild.className=awakeOn?"on":""; mk("End session",endFocus); }
    c.hidden=false; clearTimeout(fhide); if(!done) fhide=setTimeout(function(){ c.hidden=true; },6000);
  }
  function fComplete(){
    clearInterval(ftimer); fcs.done=true; try{ localStorage.removeItem(FKEY); }catch(e){}
    if(document.getElementById("focus").hidden){ document.getElementById("focus").hidden=false; document.getElementById("fbanner").hidden=true; setMeta("#000000"); }
    lockOff(); vib([300,150,300,150,300]); chime();
    document.getElementById("fprog").setAttribute("stroke-dashoffset","0");
    document.getElementById("fleft").textContent="Done"; document.getElementById("fmsg").textContent="Session complete. Well done.";
    showCtrl(true);
  }
  function endFocus(fromPop){
    clearInterval(ftimer); clearTimeout(fhide); fcs=null; try{ localStorage.removeItem(FKEY); }catch(e){}
    var shown=!document.getElementById("focus").hidden;
    document.getElementById("focus").hidden=true; document.getElementById("fbanner").hidden=true; lockOff(); setMeta("#1F6F5C");
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen(); }catch(e){}
  }
  function startFocus(total,text,endAt,qi,paused){
    fcs={end:endAt||Date.now()+total,total:total,text:text||"",done:false,warned:false,paused:paused||0,tick:!!document.getElementById("ftick").checked,qi:(typeof qi==="number")?qi:Math.floor(Math.random()*Q.length)}; fSave(); getAC(); document.getElementById("fmsg").textContent="";
    closeFocusSheet(); document.getElementById("ftitle").textContent=fcs.text;
    document.getElementById("fclock").innerHTML=buildClock();
    var c=document.getElementById("fctrl"); c.innerHTML=""; c.hidden=true;
    clearInterval(ftimer); ftimer=setInterval(fSecond,1000);
    showFocusScreen();
  }
  function openFocus(t){
    var sel=document.getElementById("ftask"); sel.innerHTML="";
    var o0=document.createElement("option"); o0.value="-1"; o0.textContent="No specific task"; sel.appendChild(o0);
    tasks.forEach(function(x,i){ if(!x.done){ var o=document.createElement("option"); o.value=String(i); o.textContent=x.text.length>40?x.text.slice(0,40)+"\u2026":x.text; sel.appendChild(o); } });
    if(t){ var i=tasks.indexOf(t); if(i>=0) sel.value=String(i); }
    document.getElementById("fsheet").hidden=false; fab.style.display="none";
  }
  function closeFocusSheet(){ document.getElementById("fsheet").hidden=true; fab.style.display=""; }
  document.getElementById("focusBtn").onclick=function(){ openFocus(); };
  document.getElementById("focusFromTask").onclick=function(){ var t=editing; closeSheet(); openFocus(t); };
  document.querySelectorAll("#fsheet .fdur button").forEach(function(b){ b.onclick=function(){ var i=parseInt(document.getElementById("ftask").value,10); startFocus(parseInt(b.dataset.m,10)*60000, (i>=0&&tasks[i])?tasks[i].text:""); }; });
  document.getElementById("fsheet").addEventListener("click",function(e){ if(e.target.id==="fsheet") closeFocusSheet(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!document.getElementById("fsheet").hidden) closeFocusSheet(); });
  document.getElementById("focus").addEventListener("click",function(){ if(!fcs||fcs.done) return; var c=document.getElementById("fctrl"); if(c.hidden) showCtrl(false); else c.hidden=true; });
  (function(){ var tk=document.getElementById("ftick"); tk.checked=true; try{ tk.checked=localStorage.getItem("todo-focus-tick")!=="0"; }catch(e){} tk.onchange=function(){ try{ localStorage.setItem("todo-focus-tick",tk.checked?"1":"0"); }catch(e){} }; })();
  try{ var sv=JSON.parse(localStorage.getItem(FKEY)||"null"); if(sv&&(sv.paused?sv.paused>Date.now()-12*3600000:sv.end>Date.now()-6*3600000)){ startFocus(sv.total,sv.text,sv.end,sv.qi,sv.paused); if(sv.paused) setMsg("Paused"); } else if(sv) localStorage.removeItem(FKEY); }catch(e){}
  render();
  var um=document.getElementById("updMsg");
  try{ if(sessionStorage.getItem("updated")){ sessionStorage.removeItem("updated"); um.textContent="Updated. You have the latest version."; setTimeout(function(){ um.textContent=""; },4000); } }catch(e){}
  document.getElementById("upd").onclick=function(){
    if(!navigator.onLine){ um.textContent="No internet. Try again when connected."; return; }
    um.textContent="Updating...";
    var files=["./","./index.html","./manifest.webmanifest","./icon-192.png","./icon-512.png"];
    var clear=window.caches ? caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}) : Promise.resolve();
    clear.then(function(){
      return Promise.all(files.map(function(f){ return fetch(f,{cache:"reload"}); }));
    }).then(function(){ try{sessionStorage.setItem("updated","1");}catch(e){} location.reload(); })
      .catch(function(){ um.textContent="Update failed. Try again."; });
  };
  if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
