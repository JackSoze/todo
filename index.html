<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>To-do</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#EDEFEC; --card:#FFFFFF; --ink:#1D2926; --muted:#6B7773; --line:#D5DAD6;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --danger:#B3402F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A18; --card:#1E2724; --ink:#E7ECE9; --muted:#8E9B96; --line:#2C3834;
    --accent:#4FBF9F; --accent-ink:#0E1513; --danger:#E27A68;
  }
}
:root[data-theme="dark"]{
  --bg:#141A18; --card:#1E2724; --ink:#E7ECE9; --muted:#8E9B96; --line:#2C3834;
  --accent:#4FBF9F; --accent-ink:#0E1513; --danger:#E27A68;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 20px 96px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px;line-height:1.15}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.add{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.add input{flex:1;min-width:0;height:58px;font:inherit;font-size:17px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.add input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.add button{height:58px;min-width:72px;font:inherit;font-weight:600;font-size:16px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.opts{display:flex;gap:8px;margin:0 0 10px}
.opts label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.opts select,.opts input{font:inherit;font-size:16px;height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%}
.opts select:focus,.opts input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
li[data-p="2"]{box-shadow:inset 4px 0 0 var(--danger)}
li[data-p="0"]{box-shadow:inset 4px 0 0 var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--muted);margin-top:0;padding-bottom:0}
.meta .hi{color:var(--danger);font-weight:600}
.meta .late{color:var(--danger);font-weight:600}
li.done .meta{opacity:.6}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tabs button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
li{display:flex;align-items:flex-start;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.num{flex:none;min-width:22px;line-height:28px;text-align:right;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);padding:0}
li.done .check{background:var(--accent);border-color:var(--accent)}
.check svg{width:16px;height:16px;opacity:0}
li.done .check svg{opacity:1}
.text{flex:1;min-width:0;font-size:16px;line-height:22px;word-break:break-word;overflow-wrap:anywhere;padding-top:3px}
li.done .t{color:var(--muted);text-decoration:line-through}
.del{flex:none;width:44px;height:44px;margin:-8px -10px -8px 0;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;border-radius:10px}
.del:hover,.del:focus-visible{color:var(--danger)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
.foot button{font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--ink);cursor:pointer;padding:10px 0}
.foot button[disabled]{opacity:.35;cursor:default}
.upd{display:flex;align-items:center;gap:12px;margin-top:26px;color:var(--muted);font-size:14px}
.upd button{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheetbox{width:100%;max-width:520px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.sheetbox .opts{margin-bottom:0}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap}
.text{cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.28);max-width:calc(100% - 32px);white-space:nowrap}
#toast[hidden]{display:none}
#toast button{font:inherit;font-weight:700;font-size:14px;color:inherit;text-decoration:underline;background:none;border:0;padding:10px 12px;cursor:pointer;border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between}
#upd{flex:none;width:44px;height:44px;margin:0 -10px 0 0;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:12px;cursor:pointer;padding:0}
#upd svg{width:22px;height:22px}
#updMsg{display:block;font-size:13px;color:var(--muted);margin:-8px 0 10px}
#updMsg:empty{display:none}
.empty{white-space:pre-line;padding:56px 24px;line-height:1.5;font-size:15px}
.empty::first-line{font-size:18px;font-weight:600;color:var(--ink)}
ul.isEmpty{background:transparent;border:0;overflow:visible}
.empty{display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:50vh;padding:24px;border:0!important;white-space:normal}
.eic{width:72px;height:72px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent);margin-bottom:16px}
.eic svg{width:32px;height:32px}
.eh{font-size:19px;font-weight:600;color:var(--ink)}
.ep{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4}
.ego{margin-top:18px;font:inherit;font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.foot[hidden]{display:none}
.affhead{font-size:13px;color:var(--muted);margin:2px 0 10px}
.affcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.afftxt{font-size:16px;line-height:1.45;font-weight:600}
.affby{font-size:12px;color:var(--muted);margin:14px 0 0;text-align:center}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;position:relative;overflow:hidden;transition:transform .12s}
button:active{transform:scale(.96)}
#fab:active{transform:translateX(-50%) scale(.96)}
.ripple{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;opacity:.2;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){.check.pop{animation:none}button:active{transform:none}#fab:active{transform:translateX(-50%)}}
@media (max-width:360px){.add button{min-width:64px;padding:0 14px}.opts{gap:6px}.opts select,.opts input{padding:0 8px}}
@media (prefers-reduced-motion:no-preference){.check{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>To-do</h1><button id="upd" type="button" aria-label="Update app" title="Update app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
  <p class="sub" id="sub"></p>
  <span id="updMsg" role="status"></span>
  <div class="sheet" id="sheet" hidden><div class="sheetbox"><div class="add">
    <input id="in" type="text" placeholder="Add a task" autocomplete="off" enterkeyhint="done" aria-label="New task">
    <button id="addBtn" type="button">Add</button>
  </div>
  <div class="opts">
    <label>Priority

    </label>
    <label>Due date

    </label>
  </div>
  </div></div>
  <div class="tabs" role="group" aria-label="Filter tasks">
    <button type="button" data-f="today" aria-pressed="true">Today</button>
    <button type="button" data-f="upcoming" aria-pressed="false">Upcoming</button>
    <button type="button" data-f="affirmations" aria-pressed="false">Affirmations</button>
  </div>
  <div id="affwrap" hidden></div>
  <ul id="list"></ul>
  <div class="foot" id="foot">
    <span id="count"></span>
    <button id="clear" type="button">Clear done</button>
  </div>
  
</main>
<button id="fab" type="button" aria-label="Add a task">+ Add task</button>
<div id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>
<script>

  function add(){

    b.onclick=function(){

    };
  });
  function sweep(){ var td=todayStr(), ch=false; tasks=tasks.filter(function(t){ if(!t.done) return true; if(!t.doneAt){ t.doneAt=td; ch=true; return true; } if(t.doneAt<td){ ch=true; return false; } return true; }); if(ch) save(); }

  var sheet=document.getElementById("sheet"), fab=document.getElementById("fab");
  var editing=null;

  var AFF=["God is my unfailing supply, and large sums of money come to me quickly, under grace, in perfect ways.", "I have a perfect work in a perfect way; I give a perfect service for perfect pay.", "I am divinely sensitive to my intuitive leads, and give instant obedience to Thy will.", "My eyes are God's eyes, I see with the eyes of spirit. I see clearly the open way; there are no obstacles on my pathway. I see clearly the perfect plan.", "I cast this burden on the Christ within, and I go free!", "Every plan my Father in heaven has not planned, shall be dissolved and dissipated, and the Divine Idea now comes to pass.", "Only that which is true of God is true of me, for I and the Father are ONE.", "As I am one with God, I am one with my good, for God is both the Giver and the Gift. I cannot separate the Giver from the gift.", "Divine Love now dissolves and dissipates every wrong condition in my mind, body and affairs.", "Divine Love floods my consciousness with health, and every cell in my body is filled with light.", "My ears are God's ears, I hear with the ears of spirit. I am nonresistant and am willing to be led. I hear glad tidings of great joy.", "Infinite Spirit, open the way for the Divine Design of my life to manifest; let the genius within me now be released; let me see clearly the perfect plan.", "Infinite Spirit, open the way for my right home, my right friend, my right position. I give thanks it now manifests under grace in a perfect way.", "I am one with Infinite Intelligence. I know everything I should know on this subject.", "In Divine Mind there is only completion, therefore, my demonstration is completed. My perfect work, my perfect home, my perfect health.", "Infinite Spirit, give me a definite lead, reveal to me my perfect self-expression, show me which talent I am to make use of now.", "I am fully equipped for the Divine Plan of my life.", "I desire only that which God desires for me.", "Father, I'll take nothing less than I've asked for, but   function weekIdx(){ var d=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5); return Math.floor((d+4)/7); }
  function renderAff(){ var w=document.getElementById("affwrap"); w.innerHTML=""; var h=document.createElement("div"); h.className="affhead"; h.textContent="This week's affirmations. They change every Sunday."; w.appendChild(h); var start=(weekIdx()*7)%AFF.length; for(var i=0;i<7;i++){ var c=document.createElement("div"); c.className="affcard"; var p=document.createElement("div"); p.className="afftxt"; p.textContent=AFF[(start+i)%AFF.length]; c.appendChild(p); w.appendChild(c); } var by=document.createElement("div"); by.className="affby"; by.textContent="Florence Scovel Shinn, The Game of Life and How to Play It (1925)"; w.appendChild(by); }
  var was5=(new Date().getHours()>=17); setInterval(function(){ var is5=(new Date().getHours()>=17); if(is5!==was5){ was5=is5; render(); } if(filter==="affirmations") renderAff(); },60000);
  var toast=document.getElementById("toast"), toastTimer, undoFn=null;
  function showUndo(msg,fn){ undoFn=fn; document.getElementById("toastMsg").textContent=msg; toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toast.hidden=true; undoFn=null; },6000); }
  document.getElementById("toastUndo").onclick=function(){ if(undoFn) undoFn(); undoFn=null; toast.hidden=true; clearTimeout(toastTimer); };
  sheet.addEventListener("click",function(e){ if(e.target===sheet) closeSheet(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!sheet.hidden) closeSheet(); });
  render();
  var um=document.getElementById("updMsg");
  try{ if(sessionStorage.getItem("updated")){ sessionStorage.removeItem("updated"); um.textContent="Updated. You have the latest version."; setTimeout(function(){ um.textContent=""; },4000); } }catch(e){}
  document.getElementById("upd").onclick=function(){
    if(!navigator.onLine){ um.textContent="No internet. Try again when connected."; return; }
    um.textContent="Updating...";
    var files=["./","./index.html","./manifest.webmanifest","./icon-192.png","./icon-512.png"];
    var clear=window.caches ? caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}) : Promise.resolve();
    clear.then(function(){
      return Promise.all(files.map(function(f){ return fetch(f,{cache:"reload"}); }));
    }).then(function(){ try{sessionStorage.setItem("updated","1");}catch(e){} location.reload(); })
      .catch(function(){ um.textContent="Update failed. Try again."; });
  };
  if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>
